services:
  maker-php:
    container_name: maker-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
      - ./docker/php/usr/local/etc/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      - ./docker/php/usr/local/etc/php/conf.d/memory.ini:/usr/local/etc/php/conf.d/memory.ini:ro
      - ./var/.bash_history:/home/app/.ash_history
    user: "1000:1000"
    environment:
      PHP_IDE_CONFIG: "serverName=maker-php"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  maker-nginx:
      container_name: maker-nginx
      image: nginx:alpine
      ports:
          - "51234:80"
      volumes:
          - ./:/app
          - ./docker/nginx/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
          - maker-php

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
