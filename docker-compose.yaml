services:
  maker-php:
    container_name: maker-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/app
      - ./docker/php/usr/local/etc/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      - ./var/.bash_history:/home/app/.ash_history
    user: "1000:1000"
    environment:
      PHP_IDE_CONFIG: "serverName=maker-php"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  maker-nginx:
      container_name: maker-nginx
      image: nginx:alpine
      ports:
          - "51234:80"
      volumes:
          - ./:/app
          - ./docker/nginx/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
          - maker-php
